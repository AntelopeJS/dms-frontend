<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <script>
      // Same store as `useColorMode()` and Nuxt UI: vueuse's default key, where
      // "auto" follows the system. The preference used to live under
      // `dms-color-mode`; carry it over once so nobody loses their choice.
      const legacy = localStorage.getItem("dms-color-mode");
      if (legacy) {
        localStorage.setItem(
          "vueuse-color-scheme",
          legacy === "system" ? "auto" : legacy,
        );
        localStorage.removeItem("dms-color-mode");
      }
      const preference = localStorage.getItem("vueuse-color-scheme") || "auto";
      const mode =
        preference === "auto"
          ? matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
          : preference;
      document.documentElement.classList.add(mode);
    </script>
    <title>Antelope DMS</title>
  </head>
  <body>
    <div class="isolate">__DMS_APP__</div>
    <div id="dms-overlays" class="isolate"></div>
    <script type="module" src="/main.ts" fetchpriority="low"></script>
  </body>
</html>
