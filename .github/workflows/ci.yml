name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [next]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    permissions:
      contents: read
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json
      renovate-sync: false
      test-job: true

  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          case "$EVENT" in
            pull_request)
              if [[ "$BASE_REF" == "$DEFAULT_BRANCH" && "$HEAD_REPOSITORY" == "$REPOSITORY" && "$HEAD_REF" =~ ^(next|develop)$ ]]; then
                tier=none
              elif [[ "$DRAFT" == true ]]; then
                tier=draft
              elif [[ "$BASE_REF" == "$DEFAULT_BRANCH" ]]; then
                tier=full
              else
                tier=fast
              fi
              ;;
            push)
              if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then tier=none; else tier=full; fi
              ;;
            schedule) tier=nightly ;;
            *) tier=full ;;
          esac
          echo "tier=${tier}" >> "$GITHUB_OUTPUT"
          echo "Tier \`${tier}\`" >> "$GITHUB_STEP_SUMMARY"

  cli:
    needs: select
    if: needs.select.outputs.tier != 'none' && needs.select.outputs.tier != 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:cli

  verify-source-dms:
    needs: select
    if: needs.select.outputs.tier != 'none' && needs.select.outputs.tier != 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AntelopeJS/dms
          ref: ${{ github.base_ref == 'campaign/integration' && 'campaign/integration' || '' }}
          path: dms
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-store-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: verify-source-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'dms/pnpm-lock.yaml') }}
          restore-keys: verify-source-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Pack at the version dms requires
        run: |
          set -euo pipefail
          floor=$(node -p 'const range = require("./dms/packages/dms/frontend-vue/package.json").engines["@antelopejs/dms-frontend"]; /\d+\.\d+\.\d+/.exec(range)[0]')
          npm pkg set version="$floor"
          pnpm pack --pack-destination "$RUNNER_TEMP/tgz"
      - name: Override @antelopejs/dms-frontend with the packed tarball, and @antelopejs/core with the range it requires
        run: |
          set -euo pipefail
          tarball=$(ls "$RUNNER_TEMP"/tgz/antelopejs-dms-frontend-*.tgz)
          core=$(node -p 'require("./package.json").peerDependencies["@antelopejs/core"]')
          cd dms
          FRONTEND="file:$tarball" CORE="$core" node - <<'EOF'
          const fs = require("node:fs");
          const overrides = {
            "@antelopejs/dms-frontend": process.env.FRONTEND,
            "@antelopejs/core": process.env.CORE,
          };
          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          manifest.pnpm = { ...manifest.pnpm, overrides: { ...manifest.pnpm?.overrides, ...overrides } };
          fs.writeFileSync("package.json", JSON.stringify(manifest, null, 2) + "\n");
          const lines = fs.readFileSync("pnpm-workspace.yaml", "utf8").split("\n");
          const head = lines.indexOf("overrides:");
          if (head !== -1) {
            let tail = head + 1;
            while (tail < lines.length && /^\s+\S/.test(lines[tail])) tail += 1;
            const isKey = (key) => (line) => new RegExp(`^\\s+["']?${key}["']?\\s*:`).test(line);
            const kept = lines.slice(head + 1, tail).filter((line) => !Object.keys(overrides).some((key) => isKey(key)(line)));
            lines.splice(head + 1, tail - head - 1, ...Object.entries(overrides).map(([key, spec]) => `  "${key}": "${spec}"`), ...kept);
            for (const key of Object.keys(overrides))
              if (lines.filter(isKey(key)).length !== 1) throw new Error(`pnpm-workspace.yaml must hold exactly one ${key} override`);
            fs.writeFileSync("pnpm-workspace.yaml", lines.join("\n"));
          }
          EOF
      - run: pnpm install --no-frozen-lockfile
        working-directory: dms
      - run: pnpm --dir packages/interface-dms build
        working-directory: dms
      - run: pnpm --dir packages/dms/frontend-vue typecheck
        working-directory: dms
      - if: github.event_name == 'push' && github.ref == 'refs/heads/next' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
        run: pnpm store prune
      - if: github.event_name == 'push' && github.ref == 'refs/heads/next' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}

  ubuntu:
    if: always()
    needs: [select, ci, cli, verify-source-dms]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.select.outputs.tier != 'none' && needs.select.outputs.tier != 'draft' && (needs.cli.result == 'skipped' || needs.verify-source-dms.result == 'skipped'))
        run: exit 1
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
