name: ci

on:
  push:
    branches:
      - main
  pull_request:

  workflow_dispatch: null
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1-campaign
    permissions:
      contents: read
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json
      renovate-sync: false

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:cli

  verify-source-dms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AntelopeJS/dms
          ref: ${{ github.base_ref == 'campaign/integration' && 'campaign/integration' || '' }}
          path: dms
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            dms/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/tgz"
      - name: Override @antelopejs/dms-frontend with the packed tarball
        run: |
          set -euo pipefail
          tarball=$(ls "$RUNNER_TEMP"/tgz/antelopejs-dms-frontend-*.tgz)
          spec="file:$tarball"
          cd dms
          SPEC="$spec" node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
            manifest.pnpm = { ...manifest.pnpm, overrides: { ...manifest.pnpm?.overrides, "@antelopejs/dms-frontend": process.env.SPEC } };
            fs.writeFileSync("package.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          sed -i "/^overrides:/a\\  \"@antelopejs/dms-frontend\": \"$spec\"" pnpm-workspace.yaml
      - run: pnpm install --no-frozen-lockfile
        working-directory: dms
      - run: pnpm --dir packages/interface-dms build
        working-directory: dms
      - run: pnpm --dir packages/dms/frontend-vue typecheck
        working-directory: dms

  ubuntu:
    if: always()
    needs: [ci, cli, verify-source-dms]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
