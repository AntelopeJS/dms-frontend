name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    permissions:
      contents: read
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json
      renovate-sync: false
      test-job: true
      single-job: false
      affected-tests: true
    secrets:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      e2e: ${{ steps.e2e.outputs.suite }}
    steps:
      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
      - name: Pick the e2e suite, the smoke set on a pull request without the ci:full label and every journey otherwise
        id: e2e
        env:
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [[ "$EVENT" == pull_request && "$FULL_LABEL" != true ]]; then suite=smoke; else suite=full; fi
          echo "suite=${suite}" >> "$GITHUB_OUTPUT"

  cli:
    needs: select
    if: needs.select.outputs.tier != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:cli

  verify-source-dms:
    needs: select
    if: needs.select.outputs.tier != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AntelopeJS/dms
          ref: ${{ github.base_ref == 'campaign/integration' && 'campaign/integration' || '' }}
          path: dms
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: pnpm-store-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: verify-source-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'dms/pnpm-lock.yaml') }}
          restore-keys: verify-source-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Pack at the version dms requires
        run: |
          set -euo pipefail
          floor=$(node -p 'const range = require("./dms/packages/dms/frontend-vue/package.json").engines["@antelopejs/dms-frontend"]; /\d+\.\d+\.\d+/.exec(range)[0]')
          npm pkg set version="$floor"
          pnpm pack --pack-destination "$RUNNER_TEMP/tgz"
      - name: Override @antelopejs/dms-frontend with the packed tarball, and @antelopejs/core with the range it requires
        run: |
          set -euo pipefail
          tarball=$(ls "$RUNNER_TEMP"/tgz/antelopejs-dms-frontend-*.tgz)
          core=$(node -p 'require("./package.json").peerDependencies["@antelopejs/core"]')
          cd dms
          FRONTEND="file:$tarball" CORE="$core" node - <<'EOF'
          const fs = require("node:fs");
          const overrides = {
            "@antelopejs/dms-frontend": process.env.FRONTEND,
            "@antelopejs/core": process.env.CORE,
          };
          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          manifest.pnpm = { ...manifest.pnpm, overrides: { ...manifest.pnpm?.overrides, ...overrides } };
          fs.writeFileSync("package.json", JSON.stringify(manifest, null, 2) + "\n");
          const lines = fs.readFileSync("pnpm-workspace.yaml", "utf8").split("\n");
          const head = lines.indexOf("overrides:");
          if (head !== -1) {
            let tail = head + 1;
            while (tail < lines.length && /^\s+\S/.test(lines[tail])) tail += 1;
            const isKey = (key) => (line) => new RegExp(`^\\s+["']?${key}["']?\\s*:`).test(line);
            const kept = lines.slice(head + 1, tail).filter((line) => !Object.keys(overrides).some((key) => isKey(key)(line)));
            lines.splice(head + 1, tail - head - 1, ...Object.entries(overrides).map(([key, spec]) => `  "${key}": "${spec}"`), ...kept);
            for (const key of Object.keys(overrides))
              if (lines.filter(isKey(key)).length !== 1) throw new Error(`pnpm-workspace.yaml must hold exactly one ${key} override`);
            fs.writeFileSync("pnpm-workspace.yaml", lines.join("\n"));
          }
          EOF
      - run: pnpm install --no-frozen-lockfile
        working-directory: dms
      - run: pnpm --dir packages/interface-dms build
        working-directory: dms
      - run: pnpm --dir packages/dms/frontend-vue typecheck
        working-directory: dms
      - if: github.event_name == 'schedule' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
        run: pnpm store prune
      - if: github.event_name == 'schedule' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}

  e2e:
    needs: select
    if: needs.select.outputs.tier != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.e2e == 'full' && '[{"part":"browser"},{"part":"journeys","shard":"1/2"},{"part":"journeys","shard":"2/2"}]' || '[{"part":"browser"}]') }}
    name: e2e (${{ matrix.part }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    env:
      SUITE: ${{ needs.select.outputs.e2e }}
      LEFTHOOK: "0"
      DMS_E2E_PREBUILT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Pick the dms commit of the installed @antelopejs/dms
        id: dms
        run: echo "ref=$(node -p 'const p = require("./node_modules/@antelopejs/dms/package.json"); p.gitHead ?? `v${p.version}`')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AntelopeJS/dms
          ref: ${{ steps.dms.outputs.ref }}
          path: dms
          persist-credentials: false
      - name: Install and build the dms playground
        working-directory: dms
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir packages/dms build
          pnpm --dir packages/dms/playground build
      - run: |
          echo "DMS_PLAYGROUND=${GITHUB_WORKSPACE}/dms/packages/dms/playground" >> "$GITHUB_ENV"
          # The dms-control names go when this repo is on a dms release with AntelopeJS/dms#1184.
          echo "DMS_CONTROL_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
          echo "DMS_E2E_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
            ~/.cache/dms-control
            ~/.cache/dms-e2e
          key: e2e-v2-${{ matrix.part }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: e2e-v2-${{ matrix.part }}-${{ runner.os }}-
      - name: Install Chromium and its system packages
        if: matrix.part == 'browser'
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install: installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - if: matrix.part == 'browser' && env.SUITE == 'smoke'
        run: pnpm e2e --grep @smoke
      - if: matrix.part == 'browser' && env.SUITE == 'full'
        run: pnpm e2e
      - if: matrix.part == 'journeys'
        run: pnpm test:journeys
        env:
          DMS_JOURNEY_SHARD: ${{ matrix.shard }}
      - if: always() && matrix.part == 'browser' && env.SUITE == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence-${{ strategy.job-index }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  ubuntu:
    if: always()
    needs: [select, ci, cli, verify-source-dms, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.select.outputs.tier != 'none' && (needs.cli.result == 'skipped' || needs.verify-source-dms.result == 'skipped' || needs.e2e.result == 'skipped'))
        run: exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
