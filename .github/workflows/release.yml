name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm distribution channel
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release source and package metadata
        env:
          CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$CHANNEL" in
            latest) release_branch=$DEFAULT_BRANCH ;;
            next) release_branch=next ;;
            *) echo "Unsupported npm channel: $CHANNEL" >&2; exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/$release_branch" || {
            echo "The $CHANNEL channel must be released from the $release_branch branch, not $GITHUB_REF." >&2
            exit 1
          }
          node <<'NODE'
          const pkg = require('./package.json')
          const errors = []
          if (pkg.name !== '@antelopejs/dms-frontend') errors.push('name must be @antelopejs/dms-frontend')
          if (pkg.repository?.url !== 'git+https://github.com/AntelopeJS/dms-frontend.git') {
            errors.push('repository.url must be git+https://github.com/AntelopeJS/dms-frontend.git')
          }
          if (pkg.publishConfig?.access !== 'public') errors.push('publishConfig.access must be public')
          if (pkg.publishConfig?.provenance !== true) errors.push('publishConfig.provenance must be true')
          if (pkg.publishConfig?.registry !== 'https://registry.npmjs.org/') {
            errors.push('publishConfig.registry must be https://registry.npmjs.org/')
          }
          if (Object.keys(pkg.bin ?? {}).join() !== 'ajs-dms') errors.push('bin must expose ajs-dms only')
          if (errors.length) {
            console.error(errors.join('\n'))
            process.exit(1)
          }
          NODE

  release:
    needs: validate
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@f4ce81591d09d271a480fd796e12a725cc973e0f
    with:
      channel: ${{ inputs.channel }}
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
