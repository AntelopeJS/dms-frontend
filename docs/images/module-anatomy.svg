<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a frontend module: each file and where it runs</title>
  <desc id="desc">package.json runs in CLI; dms.frontend.ts runs in SSR, Browser; dms.frontend.build.ts runs in Vite; dms.server.ts runs in Server; dms.email.ts runs in Server; server/ runs in Server; app/app.config.ts runs in SSR, Browser, Server; app/components · app/pages runs in SSR, Browser; i18n/locales/*.json runs in SSR, Browser, Server; public/ runs in Browser. Files from app/app.config.ts down live in the module root, or in each layers/name directory.</desc>
  <style>
    .t { font-family: Geist, Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #3f3f46; font-size: 12px; }
    .m { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #27272a; font-size: 13px; }
    .s { fill: #71717a; }
    .h { font-family: Geist, Inter, ui-sans-serif, system-ui, sans-serif; font-size: 11px; letter-spacing: 0.1em; font-weight: 600; fill: #71717a; }
    .band { fill: #71717a; fill-opacity: 0.05; }
    .grid { stroke: #a1a1aa; stroke-opacity: 0.35; stroke-width: 1; }
    .dot { fill: #1ba2af; }
    .off { fill: none; stroke: #a1a1aa; stroke-opacity: 0.6; stroke-width: 1; }
    .entry { fill: #1ba2af; fill-opacity: 0.08; stroke: #1ba2af; stroke-width: 1; }
    .brace { fill: none; stroke: #a1a1aa; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #d4d4d8; }
      .m { fill: #e4e4e7; }
      .s, .h { fill: #a1a1aa; }
      .band { fill: #a1a1aa; fill-opacity: 0.06; }
      .grid { stroke: #71717a; }
      .dot { fill: #4dd9e6; }
      .off { stroke: #71717a; }
      .entry { fill: #4dd9e6; fill-opacity: 0.08; stroke: #4dd9e6; }
      .brace { stroke: #71717a; }
    }
  </style>
  <text class="h" x="40" y="40">ACME-FRONTEND-VUE/</text>
  <text class="t s" x="40" y="62">One frontend module, as a backend module registers it with AddFrontendModule</text>
  <text class="h" x="40" y="118">FILE</text>
  <text class="h" x="548.0" y="118" text-anchor="middle">CLI</text>
  <text class="t s" x="548.0" y="136" text-anchor="middle">ajs dms</text>
  <text class="h" x="644.0" y="118" text-anchor="middle">VITE</text>
  <text class="t s" x="644.0" y="136" text-anchor="middle">at start</text>
  <text class="h" x="740.0" y="118" text-anchor="middle">SSR</text>
  <text class="t s" x="740.0" y="136" text-anchor="middle">page render</text>
  <text class="h" x="836.0" y="118" text-anchor="middle">BROWSER</text>
  <text class="t s" x="836.0" y="136" text-anchor="middle">hydrated app</text>
  <text class="h" x="932.0" y="118" text-anchor="middle">SERVER</text>
  <text class="t s" x="932.0" y="136" text-anchor="middle">Node process</text>
  <rect class="band" x="24" y="152" width="952" height="36" rx="6"/>
  <text class="m" x="40" y="168.0">package.json</text>
  <text class="t s" x="40" y="183.0">engines[&quot;@antelopejs/dms-frontend&quot;]</text>
  <circle class="dot" cx="548.0" cy="170.0" r="7"/>
  <circle class="off" cx="644.0" cy="170.0" r="3"/>
  <circle class="off" cx="740.0" cy="170.0" r="3"/>
  <circle class="off" cx="836.0" cy="170.0" r="3"/>
  <circle class="off" cx="932.0" cy="170.0" r="3"/>
  <rect class="entry" x="24" y="192" width="952" height="36" rx="6"/>
  <text class="m" x="40" y="208.0">dms.frontend.ts</text>
  <text class="t s" x="40" y="223.0">setup(sdk): components, pages, plugins</text>
  <circle class="off" cx="548.0" cy="210.0" r="3"/>
  <circle class="off" cx="644.0" cy="210.0" r="3"/>
  <circle class="dot" cx="740.0" cy="210.0" r="7"/>
  <circle class="dot" cx="836.0" cy="210.0" r="7"/>
  <circle class="off" cx="932.0" cy="210.0" r="3"/>
  <rect class="band" x="24" y="232" width="952" height="36" rx="6"/>
  <text class="m" x="40" y="248.0">dms.frontend.build.ts</text>
  <text class="t s" x="40" y="263.0">auto-imported directories</text>
  <circle class="off" cx="548.0" cy="250.0" r="3"/>
  <circle class="dot" cx="644.0" cy="250.0" r="7"/>
  <circle class="off" cx="740.0" cy="250.0" r="3"/>
  <circle class="off" cx="836.0" cy="250.0" r="3"/>
  <circle class="off" cx="932.0" cy="250.0" r="3"/>
  <text class="m" x="40" y="288.0">dms.server.ts</text>
  <text class="t s" x="40" y="303.0">routes, auth hooks, route rules, proxies</text>
  <circle class="off" cx="548.0" cy="290.0" r="3"/>
  <circle class="off" cx="644.0" cy="290.0" r="3"/>
  <circle class="off" cx="740.0" cy="290.0" r="3"/>
  <circle class="off" cx="836.0" cy="290.0" r="3"/>
  <circle class="dot" cx="932.0" cy="290.0" r="7"/>
  <rect class="band" x="24" y="312" width="952" height="36" rx="6"/>
  <text class="m" x="40" y="328.0">dms.email.ts</text>
  <text class="t s" x="40" y="343.0">server e-mail templates</text>
  <circle class="off" cx="548.0" cy="330.0" r="3"/>
  <circle class="off" cx="644.0" cy="330.0" r="3"/>
  <circle class="off" cx="740.0" cy="330.0" r="3"/>
  <circle class="off" cx="836.0" cy="330.0" r="3"/>
  <circle class="dot" cx="932.0" cy="330.0" r="7"/>
  <text class="m" x="40" y="368.0">server/</text>
  <text class="t s" x="40" y="383.0">code dms.server.ts imports</text>
  <circle class="off" cx="548.0" cy="370.0" r="3"/>
  <circle class="off" cx="644.0" cy="370.0" r="3"/>
  <circle class="off" cx="740.0" cy="370.0" r="3"/>
  <circle class="off" cx="836.0" cy="370.0" r="3"/>
  <circle class="dot" cx="932.0" cy="370.0" r="7"/>
  <rect class="band" x="24" y="392" width="952" height="36" rx="6"/>
  <text class="m" x="60" y="408.0">app/app.config.ts</text>
  <text class="t s" x="60" y="423.0">branding, Nuxt UI theme</text>
  <circle class="off" cx="548.0" cy="410.0" r="3"/>
  <circle class="off" cx="644.0" cy="410.0" r="3"/>
  <circle class="dot" cx="740.0" cy="410.0" r="7"/>
  <circle class="dot" cx="836.0" cy="410.0" r="7"/>
  <circle class="dot" cx="932.0" cy="410.0" r="7"/>
  <text class="m" x="60" y="448.0">app/components · app/pages</text>
  <text class="t s" x="60" y="463.0">Vue code the entry registers</text>
  <circle class="off" cx="548.0" cy="450.0" r="3"/>
  <circle class="off" cx="644.0" cy="450.0" r="3"/>
  <circle class="dot" cx="740.0" cy="450.0" r="7"/>
  <circle class="dot" cx="836.0" cy="450.0" r="7"/>
  <circle class="off" cx="932.0" cy="450.0" r="3"/>
  <rect class="band" x="24" y="472" width="952" height="36" rx="6"/>
  <text class="m" x="60" y="488.0">i18n/locales/*.json</text>
  <text class="t s" x="60" y="503.0">translations, merged per locale</text>
  <circle class="off" cx="548.0" cy="490.0" r="3"/>
  <circle class="off" cx="644.0" cy="490.0" r="3"/>
  <circle class="dot" cx="740.0" cy="490.0" r="7"/>
  <circle class="dot" cx="836.0" cy="490.0" r="7"/>
  <circle class="dot" cx="932.0" cy="490.0" r="7"/>
  <text class="m" x="60" y="528.0">public/</text>
  <text class="t s" x="60" y="543.0">files served as they are</text>
  <circle class="off" cx="548.0" cy="530.0" r="3"/>
  <circle class="off" cx="644.0" cy="530.0" r="3"/>
  <circle class="off" cx="740.0" cy="530.0" r="3"/>
  <circle class="dot" cx="836.0" cy="530.0" r="7"/>
  <circle class="off" cx="932.0" cy="530.0" r="3"/>
  <path class="brace" d="M46 396 H40 V544 H46"/>
  <text class="t s" x="40" y="574">Indented files live in the module root, or in each layers/&lt;name&gt;/ when the module has layers.</text>
  <text class="t s" x="40" y="592">The highlighted entry is where a module registers what it brings; a module without it is skipped.</text>
</svg>
