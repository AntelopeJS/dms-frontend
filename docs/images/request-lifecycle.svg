<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="title desc">
  <title id="title">The life of a request: first load, Inertia visit and API call</title>
  <desc id="desc">First load: the browser requests a page document; the frontend server asks the backend for the page and the site layout at /dms/page, renders it with the SSR bundle and answers with HTML, the Inertia page object and the data payload, which the browser hydrates. Inertia visit: the browser sends an X-Inertia request; the server asks for the page alone with shared=false while the browser holds the site layout, and answers with a JSON page object rendered in the browser. API call: the browser calls /api on the frontend server, which forwards it to the backend under a declared proxy prefix with the session's bearer token.</desc>
  <style>
    .t { font-family: Geist, Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #27272a; }
    .m { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #3f3f46; }
    .s { fill: #71717a; }
    .h { font-size: 11px; letter-spacing: 0.12em; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .small { font-size: 11px; }
    .code { font-size: 12px; }
    .box { fill: #71717a; fill-opacity: 0.06; stroke: #a1a1aa; stroke-width: 1.5; }
    .note { fill: #1ba2af; fill-opacity: 0.10; stroke: #1ba2af; stroke-width: 1; }
    .life { fill: none; stroke: #a1a1aa; stroke-width: 1; stroke-dasharray: 2 4; }
    .line { fill: none; stroke: #a1a1aa; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .acc { fill: none; stroke: #1ba2af; stroke-width: 2; }
    .acct { fill: #1ba2af; }
    .num { fill: #ffffff; font-weight: 600; }
    .rule { stroke: #a1a1aa; stroke-width: 1; stroke-opacity: 0.5; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #e4e4e7; }
      .m { fill: #d4d4d8; }
      .s { fill: #a1a1aa; }
      .box { stroke: #52525b; fill: #a1a1aa; fill-opacity: 0.06; }
      .note { fill: #4dd9e6; fill-opacity: 0.10; stroke: #4dd9e6; }
      .life, .line { stroke: #71717a; }
      .acc { stroke: #4dd9e6; }
      .acct { fill: #4dd9e6; }
      .num { fill: #07262b; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1a1aa"/>
    </marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1ba2af"/>
    </marker>
  </defs>

  <rect class="box" x="60" y="20" width="180" height="44" rx="10"/>
  <text class="t title" x="150" y="47" text-anchor="middle">Browser</text>
  <rect class="box" x="410" y="20" width="180" height="44" rx="10"/>
  <text class="t title" x="500" y="47" text-anchor="middle">Frontend server</text>
  <rect class="box" x="760" y="20" width="180" height="44" rx="10"/>
  <text class="t title" x="850" y="47" text-anchor="middle">DMS backend</text>

  <line class="life" x1="150" y1="64" x2="150" y2="84"/>
  <line class="life" x1="150" y1="112" x2="150" y2="358"/>
  <line class="life" x1="150" y1="386" x2="150" y2="570"/>
  <line class="life" x1="150" y1="598" x2="150" y2="684"/>
  <line class="life" x1="500" y1="64" x2="500" y2="84"/>
  <line class="life" x1="500" y1="112" x2="500" y2="358"/>
  <line class="life" x1="500" y1="386" x2="500" y2="570"/>
  <line class="life" x1="500" y1="598" x2="500" y2="684"/>
  <line class="life" x1="850" y1="64" x2="850" y2="84"/>
  <line class="life" x1="850" y1="112" x2="850" y2="358"/>
  <line class="life" x1="850" y1="386" x2="850" y2="570"/>
  <line class="life" x1="850" y1="598" x2="850" y2="684"/>

  <circle class="acct" cx="28" cy="98" r="10"/>
  <text class="t small num" x="28" y="102" text-anchor="middle">1</text>
  <text class="t s h" x="46" y="102">FIRST LOAD · SERVER RENDER</text>

  <path class="acc" d="M152 134 H498" marker-end="url(#arrow-acc)"/>
  <text class="m code" x="325" y="126" text-anchor="middle">GET /orders</text>
  <text class="t s small" x="325" y="150" text-anchor="middle">document request</text>

  <path class="acc" d="M502 184 H848" marker-end="url(#arrow-acc)"/>
  <text class="m code" x="675" y="176" text-anchor="middle">GET /dms/page?path=/orders</text>
  <text class="t s small" x="675" y="200" text-anchor="middle">Bearer token from the session</text>

  <path class="line" d="M848 234 H502" marker-end="url(#arrow)"/>
  <text class="t s small" x="675" y="226" text-anchor="middle">page + site layout (shared)</text>

  <rect class="note" x="420" y="246" width="160" height="34" rx="6"/>
  <text class="t small" x="500" y="267" text-anchor="middle">SSR render, Vite bundle</text>

  <path class="line" d="M498 304 H152" marker-end="url(#arrow)"/>
  <text class="m small" x="325" y="296" text-anchor="middle">HTML · page object · dms-payload</text>
  <text class="t s small" x="325" y="320" text-anchor="middle">hydrates without fetching again</text>

  <line class="rule" x1="20" y1="344" x2="980" y2="344"/>

  <circle class="acct" cx="28" cy="372" r="10"/>
  <text class="t small num" x="28" y="376" text-anchor="middle">2</text>
  <text class="t s h" x="46" y="376">CLIENT NAVIGATION · INERTIA VISIT</text>

  <path class="acc" d="M152 408 H498" marker-end="url(#arrow-acc)"/>
  <text class="m code" x="325" y="400" text-anchor="middle">GET /customers</text>
  <text class="m small" x="325" y="424" text-anchor="middle">X-Inertia: true</text>

  <path class="acc" d="M502 458 H848" marker-end="url(#arrow-acc)"/>
  <text class="m code" x="675" y="450" text-anchor="middle">/dms/page?path=/customers&amp;shared=false</text>
  <text class="t s small" x="675" y="474" text-anchor="middle">the browser holds the layout for 5 minutes</text>

  <path class="line" d="M848 506 H502" marker-end="url(#arrow)"/>
  <text class="t s small" x="675" y="498" text-anchor="middle">page</text>

  <path class="line" d="M498 530 H152" marker-end="url(#arrow)"/>
  <text class="t s small" x="325" y="522" text-anchor="middle">page object (JSON), rendered in the browser</text>

  <line class="rule" x1="20" y1="556" x2="980" y2="556"/>

  <circle class="acct" cx="28" cy="584" r="10"/>
  <text class="t small num" x="28" y="588" text-anchor="middle">3</text>
  <text class="t s h" x="46" y="588">API CALL · BACKEND PROXY</text>

  <path class="acc" d="M152 620 H498" marker-end="url(#arrow-acc)"/>
  <text class="m code" x="325" y="612" text-anchor="middle">POST /api/orders</text>
  <text class="t s small" x="325" y="636" text-anchor="middle">same Origin, sealed cookie</text>

  <path class="acc" d="M502 620 H848" marker-end="url(#arrow-acc)"/>
  <text class="m code" x="675" y="612" text-anchor="middle">POST /api/orders</text>
  <text class="t s small" x="675" y="636" text-anchor="middle">declared prefix /api/** · Bearer token</text>

  <path class="line" d="M848 668 H152" marker-end="url(#arrow)"/>
  <text class="t s small" x="675" y="660" text-anchor="middle">JSON, relayed as is</text>
</svg>
